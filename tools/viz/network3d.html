<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neural Trader</title>
<style>
  :root {
    --bg: #02030a; --fg: #d9e7ff; --dim: #5d6b8a;
    --cyan: #19e6ff; --mag: #ff2e88; --green: #00ffa3; --gold: #ffc53d; --orange: #ff8a1f;
    --hud: "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font-family: var(--hud); }
  canvas { display: block; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 0 8px currentColor; }
  #title { top: 16px; left: 24px; }
  #title h1 { margin: 0; font: 700 22px/1 var(--hud); letter-spacing: .32em; color: var(--cyan); }
  #title div { margin-top: 6px; font-size: 12px; letter-spacing: .14em; color: var(--dim); text-shadow: none; }
  #stats { top: 14px; right: 24px; display: grid; grid-template-columns: repeat(3, auto); gap: 6px 22px; text-align: right; }
  .stat .k { font: 600 10px/1 var(--hud); letter-spacing: .22em; color: var(--dim); text-shadow: none; }
  .stat .v { font: 600 21px/1.2 var(--hud); font-variant-numeric: tabular-nums; }
  .stat .v.sm { font-size: 16px; line-height: 1.55; }
  #rstats { right: 24px; display: none; grid-template-columns: repeat(3, auto); gap: 0 22px; text-align: right; }
  body.ro #rstats { display: grid; }
  .lbl { position: fixed; pointer-events: none; font: 600 13px/1 var(--hud); letter-spacing: .12em;
         white-space: nowrap; transform: translate(-50%, -50%); text-shadow: 0 0 10px currentColor; }
  .lbl.tag { font: 600 10px/1 var(--hud); letter-spacing: .3em; color: var(--dim); text-shadow: none; }
  .lbl.out { transform: translate(14px, -50%); font-size: 14px; }
  .lbl.out .bar { display: inline-block; height: 4px; margin-left: 8px; vertical-align: middle;
                  background: currentColor; box-shadow: 0 0 8px currentColor; border-radius: 2px; }
  #drivers { left: 24px; top: 150px; width: 300px; display: none; }
  #drivers .k { font: 600 10px/1 var(--hud); letter-spacing: .26em; color: var(--dim); text-shadow: none; margin-bottom: 7px; }
  #drivers .r { display: grid; grid-template-columns: 1fr 70px 48px; align-items: center; gap: 8px; font: 600 12px/1.55 var(--hud); text-shadow: none; }
  #drivers .r .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
  #drivers .r .b { height: 5px; border-radius: 3px; background: currentColor; box-shadow: 0 0 6px currentColor; }
  #drivers .r .v { text-align: right; font-variant-numeric: tabular-nums; }
  body.dash #drivers { display: none !important; }
  #chartLbl { left: 24px; font: 600 10px/1 var(--hud); letter-spacing: .3em; color: var(--dim); text-shadow: none; }
  #pxHi, #pxLo { right: 24px; font: 600 12px/1 var(--hud); color: var(--dim); text-shadow: none; }
  .panel { position: fixed; background: rgba(6, 10, 24, .72); border: 1px solid rgba(25, 230, 255, .18);
           border-radius: 12px; backdrop-filter: blur(6px); font-size: 13px; color: var(--dim); }
  #ctrl { right: 18px; bottom: 14px; display: flex; gap: 10px; align-items: center; padding: 7px 12px; }
  #timeline { left: 18px; bottom: 14px; padding: 8px 12px; display: none; gap: 12px; align-items: center; }
  #timeline .lab { font: 600 12px/1.25 var(--hud); color: var(--fg); min-width: 250px; }
  #timeline .lab small { display: block; color: var(--dim); font-size: 11px; letter-spacing: .08em; }
  .panel button { background: transparent; color: var(--cyan); border: 1px solid rgba(25, 230, 255, .35);
                  border-radius: 7px; padding: 3px 9px; font: 600 12px var(--hud); cursor: pointer; }
  .panel button.on { background: rgba(25, 230, 255, .14); }
  .panel button.rec { color: var(--mag); border-color: rgba(255, 46, 136, .5); }
  .panel input[type=range] { width: 80px; accent-color: var(--cyan); }
  #tSlider { width: 170px; }
  .panel select { background: #070b1a; color: var(--fg); border: 1px solid #1d2a4a; border-radius: 6px; }
  #spark { display: block; }
  #wait, #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; pointer-events: none; }
  #wait h2 { margin: 0; font: 700 20px var(--hud); letter-spacing: .4em; color: var(--cyan); text-shadow: 0 0 14px var(--cyan); }
  #wait p { color: var(--dim); letter-spacing: .14em; }
  #err { color: var(--mag); font: 600 16px var(--hud); }
  #idle { position: fixed; top: 104px; left: 50%; transform: translateX(-50%); pointer-events: none;
          font: 600 12px var(--hud); letter-spacing: .22em; color: var(--dim); white-space: nowrap;
          padding: 6px 14px; border: 1px solid rgba(93, 107, 138, .35); border-radius: 999px;
          background: rgba(6, 10, 24, .6); opacity: 0; transition: opacity .4s; }
  body.dash #gl, body.dash #labels, body.dash #stats, body.dash #chartLbl, body.dash #pxHi,
  body.dash #pxLo, body.dash #idle, body.dash .c3d, body.dash #rstats { display: none !important; }
  #mon { display: none; } body.mon #mon { display: block; }
  body.mon #dash, body.mon #timeline, body.mon #title, body.mon #banner { display: none !important; }
  #banner { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); pointer-events: none;
            font: 700 16px var(--hud); letter-spacing: .3em; color: var(--gold); text-shadow: 0 0 14px var(--gold);
            opacity: 0; transition: opacity .35s; white-space: nowrap; }
  /* ---------- 3D-mode HUD: "deep glass" (dark frosted blue, specular line). ?hud=flat disables it. */
  body:not(.dash):not(.flat) .panel, body:not(.dash):not(.flat) #stats, body:not(.dash):not(.flat) #rstats, body:not(.dash):not(.flat) #drivers, body:not(.dash):not(.flat) #idle {
    background: linear-gradient(135deg, rgba(25,230,255,.10), rgba(25,230,255,.02) 40%, rgba(255,255,255,.015));
    backdrop-filter: blur(14px) saturate(170%); border: 1px solid rgba(25,230,255,.22); border-radius: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(25,230,255,.08), 0 12px 36px rgba(0,0,0,.45); }
  body:not(.dash):not(.flat) #stats, body:not(.dash):not(.flat) #rstats { padding: 10px 16px 12px; }
  body:not(.dash):not(.flat) #drivers { padding: 10px 12px 8px; }
  body:not(.dash):not(.flat) .panel::before, body:not(.dash):not(.flat) #stats::before, body:not(.dash):not(.flat) #rstats::before, body:not(.dash):not(.flat) #drivers::before {
    content: ""; position: absolute; left: 10%; right: 10%; top: 0; height: 1px; pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.7) 40%, rgba(25,230,255,.6) 60%, transparent); }
  body:not(.dash):not(.flat) #stats .stat .k, body:not(.dash):not(.flat) #rstats .stat .k { color: #8fa0c4; }
  body:not(.dash):not(.flat) #banner { background: linear-gradient(135deg, rgba(255,197,61,.16), rgba(255,197,61,.03)); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,197,61,.35); border-radius: 12px; padding: 8px 18px; }
  /* ---------- theme "clear" (Clear Liquid, chosen 2026-10-18): light aurora + white glass for the
     panel modes only; the 3D scene stays dark. ?theme=dark keeps the old panels. Chart palettes are
     read by monitor.js / dashboard.js from the --c-* variables so they follow the theme. */
  :root { --c-cyan: #19e6ff; --c-gold: #ffc53d; --c-green: #00ffa3; --c-mag: #ff2e88; --c-orange: #ff8a1f; --c-purple: #b48cff; --c-dim: #5d6b8a; --c-fg: #d9e7ff; --c-grid: #0d2a4d; }
  body.clear.dash, body.clear.mon { --fg: #0f1a2b; --dim: #5b6b85; --cyan: #0a66ff;
    --c-cyan: #0a8fd6; --c-gold: #c98a00; --c-green: #0f9a5a; --c-mag: #d01e52; --c-orange: #e0661a; --c-purple: #7a4de0; --c-dim: #6b7a92; --c-fg: #0f1a2b; --c-grid: #c9d4e4;
    background: #dfe8f6; }
  body.clear.dash::before, body.clear.mon::before { content: ""; position: fixed; inset: -10%; z-index: -1; filter: blur(60px); opacity: .9; pointer-events: none;
    background: radial-gradient(500px 420px at 18% 22%, #ffb86b, transparent 70%), radial-gradient(560px 460px at 80% 18%, #7cc4ff, transparent 70%),
                radial-gradient(640px 520px at 60% 90%, #c58cff, transparent 70%), radial-gradient(420px 380px at 10% 85%, #7fffd4, transparent 70%); }
  body.clear.dash .panel, body.clear.mon .panel { background: linear-gradient(140deg, rgba(255,255,255,.78), rgba(255,255,255,.5)); border: 1px solid rgba(255,255,255,.85);
    backdrop-filter: blur(26px) saturate(180%); box-shadow: inset 0 1px 0 #fff, 0 10px 30px rgba(15,26,43,.14); color: var(--dim); border-radius: 16px; }
  body.clear.dash .panel button, body.clear.mon .panel button { color: #0a66ff; border-color: rgba(10,102,255,.35); } body.clear.dash .panel button.on, body.clear.mon .panel button.on { background: rgba(10,102,255,.12); }
  body.clear.dash .panel select, body.clear.mon .panel select { background: rgba(255,255,255,.8); color: var(--fg); border-color: rgba(15,26,43,.15); }
  body.clear.dash .panel input[type=range], body.clear.mon .panel input[type=range] { accent-color: #0a66ff; }
  body.clear.dash #timeline .lab { color: var(--fg); }
  /* dashboard cards */
  body.clear.dash .dcard, body.clear.dash .kpi { background: linear-gradient(140deg, rgba(255,255,255,.74), rgba(255,255,255,.44)); border: 1px solid rgba(255,255,255,.8);
    backdrop-filter: blur(22px) saturate(180%); box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 14px 40px rgba(15,26,43,.12), 0 1px 2px rgba(15,26,43,.08); border-radius: 18px; }
  body.clear.dash .dcard h3, body.clear.dash .kpi .k, body.clear.dash .heat .lab { color: var(--dim); } body.clear.dash .dcard h3 b { color: var(--fg); }
  body.clear.dash #title h1 { color: #0f1a2b; text-shadow: none; } body.clear.dash #title div { color: var(--dim); }
  body.clear.dash .dlegend, body.clear.dash .trades td, body.clear.dash .trades th { color: var(--fg); }
  /* ---------- Clear Liquid 3D (2026-10-19): the scene itself is light (aurora texture, normal blending,
     ink palette, no bloom — see LIGHT in the script); the HUD becomes white glass with dark text. */
  body.clear { --bg: #dfe8f6; --fg: #0f1a2b; --dim: #5b6b85; --cyan: #0a66ff; --mag: #d01e52; --green: #0f9a5a; --gold: #a66f00; --orange: #d9590a; }
  body.clear .hud, body.clear .lbl.tag { text-shadow: none; }
  body.clear .lbl:not(.tag) { text-shadow: 0 1px 0 rgba(255,255,255,.95), 0 0 8px rgba(255,255,255,.9); }
  body.clear .lbl.out .bar, body.clear #drivers .r .b { box-shadow: none; }
  body.clear #title h1 { color: #0f1a2b; text-shadow: none; letter-spacing: .26em; }
  body.clear:not(.dash):not(.flat) .panel, body.clear:not(.dash):not(.flat) #stats, body.clear:not(.dash):not(.flat) #rstats,
  body.clear:not(.dash):not(.flat) #drivers, body.clear:not(.dash):not(.flat) #idle {
    background: linear-gradient(140deg, rgba(255,255,255,.80), rgba(255,255,255,.52)); border: 1px solid rgba(255,255,255,.9);
    backdrop-filter: blur(24px) saturate(180%); border-radius: 18px; color: var(--dim);
    box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 rgba(15,26,43,.05), 0 14px 40px rgba(15,26,43,.14), 0 1px 2px rgba(15,26,43,.08); }
  body.clear:not(.dash):not(.flat) .panel::before, body.clear:not(.dash):not(.flat) #stats::before, body.clear:not(.dash):not(.flat) #rstats::before,
  body.clear:not(.dash):not(.flat) #drivers::before { left: 0; right: 0; height: 100%; border-radius: inherit;
    background: linear-gradient(115deg, rgba(255,255,255,.55) 0%, transparent 35%, transparent 70%, rgba(255,255,255,.3) 100%); }
  body.clear:not(.dash):not(.flat) #stats .stat .k, body.clear:not(.dash):not(.flat) #rstats .stat .k { color: var(--dim); }
  body.clear:not(.dash):not(.flat) #banner { background: linear-gradient(135deg, rgba(255,196,70,.45), rgba(255,255,255,.7)); color: #8a5a00; text-shadow: none;
    border: 1px solid rgba(255,255,255,.9); box-shadow: 0 10px 30px rgba(15,26,43,.14); }
  body.clear .panel button { color: #0a66ff; border-color: rgba(10,102,255,.35); } body.clear .panel button.on { background: rgba(10,102,255,.12); }
  body.clear .panel button.rec { color: var(--mag); border-color: rgba(208,30,82,.4); }
  body.clear .panel select { background: rgba(255,255,255,.85); color: var(--fg); border-color: rgba(15,26,43,.15); }
  body.clear .panel input[type=range] { accent-color: #0a66ff; }
  body.clear #timeline .lab { color: var(--fg); }
  body.clear #wait h2 { color: #0a66ff; text-shadow: none; } body.clear #err { color: var(--mag); }
  body.clear .darkonly { display: none !important; }
</style>
</head>
<body>
<div id="title" class="hud"><h1>NEURAL&nbsp;TRADER</h1><div id="sub"></div></div>
<div id="stats" class="hud">
  <div class="stat"><div class="k">BAR</div><div class="v" id="sBar" style="color:var(--fg)">–</div></div>
  <div class="stat"><div class="k">EQUITY</div><div class="v" id="sEq">–</div></div>
  <div class="stat"><div class="k">POSITION</div><div class="v" id="sPos">–</div></div>
  <div class="stat"><div class="k">TRADES</div><div class="v" id="sTr" style="color:var(--cyan)">–</div></div>
  <div class="stat"><div class="k">WIN RATE</div><div class="v" id="sWr" style="color:var(--gold)">–</div></div>
  <div class="stat"><div class="k">CRITIC V(s)</div><div class="v" id="sV">–</div></div>
</div>
<div id="rstats" class="hud">
  <div class="stat"><div class="k">REWARD</div><div class="v" id="sRw">–</div></div>
  <div class="stat"><div class="k">ADVANTAGE</div><div class="v" id="sAdv">–</div></div>
  <div class="stat"><div class="k">SAMPLED · GREEDY</div><div class="v sm" id="sExp">–</div></div>
</div>
<div id="labels"></div>
<div id="drivers" class="hud"><div class="k">TOP DRIVERS · <span id="drvWhat">this decision</span></div><div id="drvList"></div></div>
<div id="dash"></div>
<div id="mon"></div>
<div id="chartLbl" class="hud"></div>
<div id="pxHi" class="hud"></div><div id="pxLo" class="hud"></div>
<div id="banner"></div>
<div id="idle"></div>
<div id="timeline" class="panel">
  <div class="lab" id="tLab">–<small>–</small></div>
  <input id="tSlider" type="range" min="0" max="0" value="0">
  <svg id="spark" width="170" height="40"></svg>
  <button id="bLive" class="on">● LIVE</button>
</div>
<div id="ctrl" class="panel">
  <label class="c3d" id="lSrc" style="display:none">source <select id="iSrc"><option value="training">Training (live)</option><option value="eval">Eval replay</option></select></label>
  <label>mode <select id="iMode"><option value="lite">Lite</option><option value="cinematic">Cinematic</option><option value="dashboard">Dashboard</option><option value="monitor">Monitor</option></select></label>
  <button id="bPlay" class="c3d">❚❚</button>
  <label class="c3d">speed <input id="iSpeed" type="range" min="1" max="20" value="6"></label>
  <label class="c3d">inputs <select id="iIn"><option value="attr">attribution</option><option value="act">activation</option></select></label>
  <label class="c3d">synapses <select id="iK"><option value="4">4</option><option value="8" selected>8</option><option value="16">16</option></select></label>
  <label class="c3d darkonly">glow <input id="iGlow" type="range" min="0" max="30" value="9"></label>
  <label class="c3d">fps <select id="iFps"><option>15</option><option>20</option><option>30</option><option>60</option></select></label>
  <button id="bRot" class="on c3d">orbit</button>
  <button id="bRec" class="rec c3d">● rec</button>
  <button id="bFull">⛶</button>
</div>
<div id="wait"><div><h2>WAITING FOR TRAINING DATA</h2><p>training rollouts arrive after the first PPO rollout · eval replays every 10,000 steps</p></div></div>
<div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/",
  "viz-dashboard": "./dashboard.js",
  "viz-monitor": "./monitor.js"
} }
</script>
<script>window.SNAPSHOT = /*__SNAPSHOT__*/null;</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { createDashboard } from "viz-dashboard";
import { createMonitor } from "viz-monitor";

const params = new URLSearchParams(location.search);
if (params.get("theme") !== "dark") document.body.classList.add("clear");   // Clear Liquid (all modes); ?theme=dark = neon on black
// LIGHT = the 3D scene is drawn on a light aurora: normal blending with brightness carried in
// alpha (weak nodes/lines fade to the background instead of to black), darker palette, no bloom.
const LIGHT = document.body.classList.contains("clear");
const BLEND = LIGHT ? THREE.NormalBlending : THREE.AdditiveBlending;
if (params.get("hud") === "flat") document.body.classList.add("flat");         // plain HUD in the 3D modes (A/B measuring)
const LIVE = params.has("live") && !window.SNAPSHOT;
// Display modes (measured in WebView2, docs/viz_display_modes_2026-10-11.md):
//   lite      ~20-25% of one core — no bloom, 4 synapses/neuron, no pulses, 1x pixels, 20 fps
//   cinematic ~60%                — bloom, 8 synapses, pulses, up to 2x pixels, 30 fps
//   dashboard ~0%                 — static panels redrawn only when a snapshot arrives (no loop)
// URL: mode=lite|cinematic (default: lite when live, cinematic for a static page);
// single knobs bloom=0|1 · k=4|8|16 · pulses=0|1 · dpr=1|2 · fps=N override the preset.
// Auto idle: live pages play each snapshot once, then stop rendering until the next
// evaluation arrives or the mouse moves (loop=1 to keep looping); every page stops
// while minimised/hidden and after 8 s paused without input.
const MODES = {
  lite:      { bloom: false, k: 4, pulses: false, dpr: 1, fps: 20 },
  cinematic: { bloom: true,  k: 8, pulses: true,  dpr: 2, fps: 30 },
  dashboard: { bloom: false, k: 4, pulses: false, dpr: 1, fps: 20, dashboard: true },
  monitor:   { bloom: false, k: 4, pulses: false, dpr: 1, fps: 20, dashboard: true, monitor: true },
};
let mode = MODES[params.get("mode")] ? params.get("mode") : (LIVE ? "lite" : "cinematic");
const OPT = Object.assign({}, MODES[mode]);
if (params.has("bloom")) OPT.bloom = params.get("bloom") !== "0";
if (params.has("pulses")) OPT.pulses = params.get("pulses") !== "0";
if (params.has("dpr")) OPT.dpr = +params.get("dpr");
if (params.has("k")) OPT.k = +params.get("k");
if (params.has("fps")) OPT.fps = +params.get("fps");
OPT.play = params.get("play") !== "0";
const LOOP = params.has("loop") ? params.get("loop") === "1" : !LIVE;
let fpsCap = OPT.fps;
document.getElementById("iFps").value = String(fpsCap);
document.getElementById("iMode").value = mode;
const $ = id => document.getElementById(id);
const fail = msg => { const e = $("err"); e.style.display = "grid"; e.textContent = msg; };

// ================================================================== static scene
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(OPT.dpr, 2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
renderer.domElement.id = "gl";
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const BG_LIGHT = new THREE.Color("#e3eaf6");
function auroraTexture() {         // the Clear Liquid aurora (same blobs as the app's CSS), painted once
  const c = document.createElement("canvas"); c.width = 1600; c.height = 1000;
  const g = c.getContext("2d"); g.fillStyle = "#dfe8f6"; g.fillRect(0, 0, c.width, c.height);
  for (const [x, y, r, col] of [[0.18, 0.22, 560, "255,184,107"], [0.80, 0.18, 620, "124,196,255"], [0.60, 0.90, 700, "197,140,255"], [0.10, 0.85, 480, "127,255,212"]]) {
    const gr = g.createRadialGradient(x * c.width, y * c.height, 0, x * c.width, y * c.height, r);
    gr.addColorStop(0, `rgba(${col},.30)`); gr.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = LIGHT ? auroraTexture() : new THREE.Color(0x02030a);
scene.fog = LIGHT ? new THREE.FogExp2(0xe3eaf6, 0.0055) : new THREE.FogExp2(0x02030a, 0.0085);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 600);   // fov set from VIEW below
// default framing: az/pol = sway centre (rad), amp = sway half-width (az; pol sways a quarter of it), dist = camera distance, tx = target x,
// ox = horizontal view shift (fraction of the width; + moves the scene right, clear of the drivers panel).
// fov = lens (deg), oy = vertical view shift (fraction of the height; + lifts the scene above the chart panel).
// ?view=az,pol,dist,tx,ox,amp,fov,oy overrides it; ?sway=0 starts with the auto-orbit off.
// The defaults look along the input slab from the front-left so its 10 bar rows read as a grid between the
// drivers panel and the hidden-layer towers, and keep the output labels clear of the stats panel.
const VIEW = { az: -0.62, pol: 1.2, dist: 78, tx: -4, ox: 0.06, amp: 0.16, fov: 36, oy: 0.10 };

  const rw = index.map(x => Number(x.eval_reward)).filter(Number.isFinite);
  if (rw.length < 1) { svg.innerHTML = ""; return; }
  const lo = Math.min(...rw), hi = Math.max(...rw), w = 170, h = 40, pad = 4;
  const X = i => pad + (index.length > 1 ? i * (w - 2 * pad) / (index.length - 1) : (w - 2 * pad) / 2);
  const Y = v => h - pad - (hi > lo ? (v - lo) / (hi - lo) : 0.5) * (h - 2 * pad);
  const pts = index.map((x, i) => `${X(i).toFixed(1)},${Y(Number(x.eval_reward)).toFixed(1)}`).join(" ");
  const glowF = c => LIGHT ? "" : `filter:drop-shadow(0 0 3px ${c})`;
  svg.innerHTML = `<polyline points="${pts}" fill="none" style="stroke:var(--cyan);stroke-width:1.6;${glowF("var(--cyan)")}"/>` +
    `<circle cx="${X(pos)}" cy="${Y(Number(e.eval_reward))}" r="3.2" style="fill:var(--gold);${glowF("var(--gold)")}"/>`;
}
// scrubbing the eval timeline = watch that eval (pins the source to eval replays)
$("tSlider").oninput = ev => {
  follow = false; srcPinned = true; source = "eval"; $("iSrc").value = "eval";
  const e = index[+ev.target.value];
  if (e && e.i !== loadedI) loadSnap(e); else if (evalD && shown !== "eval") applySnapshot(evalD);
};
$("bLive").onclick = () => {
  if (haveRollout) { setSource("training", true); return; }
  follow = true; const last = index[index.length - 1]; if (last && last.i !== loadedI) loadSnap(last); renderTimeline();
};
$("iSrc").onchange = e => setSource(e.target.value, true);

// ================================================================== loop
let playing = OPT.play, speed = 6, K = OPT.k, glow = 0.9, lastT = performance.now(), lastDraw = 0, drawn = 0;
$("iK").value = String(K); if (!playing) $("bPlay").textContent = "▶";

// ---------------------------------------------------------------- auto idle
// hostMinimized comes only from the pywebview window events; page visibility is
// read live (a cached flag can go stale when the window is first shown)
let idle = false, idleReason = "", hostMinimized = false, lastInput = performance.now();
const pageHidden = () => hostMinimized || document.visibilityState === "hidden";
const IDLE_TEXT = {
  replay: "💤 IDLE · REPLAY DONE — WAITING FOR THE NEXT EVALUATION · MOVE THE MOUSE TO REPLAY",
  replayRoll: "💤 IDLE · REPLAY DONE — WAITING FOR THE NEXT TRAINING ROLLOUT · MOVE THE MOUSE TO REPLAY",
  paused: "💤 IDLE · PAUSED — MOVE THE MOUSE TO WAKE",
  hidden: "💤 IDLE · WINDOW HIDDEN",
};
function sleep(reason) {
  if (idle) return;
  idle = true; idleReason = reason;
  const el = $("idle"); el.textContent = IDLE_TEXT[reason === "replay" && shown === "rollout" ? "replayRoll" : reason] || "💤 IDLE"; el.style.opacity = (reason === "hidden" || reason === "dashboard") ? 0 : 1;
}
function wake(reason) {
  if (reason === "input") lastInput = performance.now();
  if (mode === "dashboard" || mode === "monitor") return;   // panel modes have no render loop
  if (pageHidden() && reason !== "host") return;            // stay asleep while minimised / hidden
  if (!idle) return;
  if (reason === "input" && idleReason === "replay" && S) seek(START);   // mouse = watch it again
  idle = false; idleReason = ""; $("idle").style.opacity = 0;
  lastT = performance.now(); lastDraw = 0;

}
function setHidden(flag) {            // called by live_viewer.py on minimize / restore
  hostMinimized = !!flag;
  if (pageHidden()) sleep("hidden"); else wake("host");
}
for (const ev of ["pointermove", "pointerdown", "wheel", "keydown"]) addEventListener(ev, () => wake("input"), { passive: true });
document.addEventListener("visibilitychange", () => { if (pageHidden()) sleep("hidden"); else wake("host"); });

function frame(now) {
  if (idle) return;                       // loop stopped: wake() restarts it
  requestAnimationFrame(frame);
  if (now - lastDraw < 1000 / fpsCap - 1.5) return;
  lastDraw = now; drawn++;
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;

        else { fpos = S.NF - 1; if (!endAt) endAt = now; }
      }
    }
    sample(fpos);
    updateNetwork(dt);
    const ch = updateChart(fpos, dt);
    const fi = Math.floor(fpos);
    if (fi !== lastFrame) { for (let i = lastFrame + 1; i <= fi; i++) onNewBar(i, ch); lastFrame = fi; }
    for (let a = 0; a < S.NA; a++) {
      const p = Math.max(0, S.cur[S.OFF_PROB + a]), k = (S.OFF_PROB + a) * 3, el = NET.outLbl[a];
      el.children[0].textContent = Math.round(p * 100) + "%"; el.children[1].style.width = (p * 90) + "px";
      placeLabel(el, S.posOf[k], S.posOf[k + 1], S.posOf[k + 2]);
    }
    const v = S.cur[S.OFF_VAL] * S.D.value_max;
    NET.valLbl.children[0].textContent = (v >= 0 ? "+" : "") + v.toFixed(3);
    $("sV").textContent = (v >= 0 ? "+" : "") + v.toFixed(3); $("sV").style.color = v >= 0 ? "var(--orange)" : "var(--cyan)";
    placeLabel(NET.valLbl, S.posOf[S.OFF_VAL * 3], S.posOf[S.OFF_VAL * 3 + 1], 0);
    for (const [el, p] of NET.tags) placeLabel(el, p[0], p[1], p[2]);
  }
  glowPulse = Math.max(0, glowPulse - dt * 1.4);
  bloom.strength = glow * (1 + glowPulse * 1.2);
  if (sway && now > swayHold) {
    off3.copy(camera.position).sub(controls.target); sph.setFromVector3(off3);
    const az = VIEW.az + VIEW.amp * Math.sin(now * 0.00011), pol = VIEW.pol + 0.25 * VIEW.amp * Math.sin(now * 0.00007);
    sph.theta += (az - sph.theta) * 0.02; sph.phi += (pol - sph.phi) * 0.02;
    off3.setFromSpherical(sph); camera.position.copy(controls.target).add(off3);
  }
  controls.update();
  composer.render();
  if (endAt && now - endAt > 1500) {                         // let the last bursts fade first
    if (source === "training" && rollPending && mode !== "dashboard" && mode !== "monitor") loadRollout();
    else if (!rollLoading) sleep("replay");
  }
  else if (!playing && now - lastInput > 8000) sleep("paused");
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h); bloom.setSize(w, h);
  camera.aspect = w / h; camera.setViewOffset(w, h, -w * VIEW.ox, h * VIEW.oy, w, h); camera.updateProjectionMatrix();
  layoutChart();
}
addEventListener("resize", resize);
resize();

function applyMode(name) {
  if (!MODES[name]) return;
  const isPanel = n => n === "dashboard" || n === "monitor";
  const leavingDash = isPanel(mode) && !isPanel(name);
  mode = name; Object.assign(OPT, MODES[name]);
  $("iMode").value = name;
  document.body.classList.toggle("dash", isPanel(name));
  document.body.classList.toggle("mon", name === "monitor");
  if (isPanel(name)) { sleep("dashboard"); dashUpdate(); if (name === "monitor") loadPeers().then(() => monUpdate()); else monUpdate(); return; }
  if (leavingDash && idle) { idle = false; idleReason = ""; lastT = performance.now(); lastDraw = 0; requestAnimationFrame(frame); }
  bloom.enabled = OPT.bloom && !LIGHT; K = OPT.k; fpsCap = OPT.fps;
  renderer.setPixelRatio(Math.min(OPT.dpr, 2, devicePixelRatio || 1));
  composer.setPixelRatio(renderer.getPixelRatio());
  bursts.material.uniforms.uScale.value = renderer.getPixelRatio();
  resize();
  $("iK").value = String(K); $("iFps").value = String(fpsCap); $("iMode").value = name;
  wake("input");
  if (source === "training" && haveRollout && (shown !== "rollout" || rollPending)) loadRollout();
}
$("iMode").onchange = e => applyMode(e.target.value);
$("bPlay").onclick = e => { playing = !playing; e.target.textContent = playing ? "❚❚" : "▶"; if (playing && endAt) seek(START); wake("input"); };
$("iSpeed").oninput = e => speed = +e.target.value;
$("iK").onchange = e => K = +e.target.value;
$("iIn").onchange = e => { inputMode = e.target.value; if (S) drivers(Math.min(S.NF - 1, Math.floor(fpos))); wake("input"); };
$("iGlow").oninput = e => glow = +e.target.value / 10;
$("iFps").onchange = e => fpsCap = +e.target.value;
$("bRot").classList.toggle("on", sway);
$("bRot").onclick = e => { sway = !sway; swayHold = 0; e.target.classList.toggle("on", sway); };
$("bFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
let rec = null, chunks = [];
$("bRec").onclick = () => {      // records the WebGL canvas (HUD text is HTML and is not captured)
  const b = $("bRec");
  if (rec) { rec.stop(); return; }
  const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  rec = new MediaRecorder(renderer.domElement.captureStream(60), { mimeType: mime, videoBitsPerSecond: 16e6 }); chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
    a.download = `${(S && S.D.meta && S.D.meta.model) || "neural"}_trader.webm`; a.click(); rec = null; b.textContent = "● rec"; };
  rec.start(); b.textContent = "■ stop";
};
const dash = createDashboard($("dash"), {
  colors: ACTION_COLORS,
  fetchSnapshot: async e => { const r = await fetch(`run/${e.file}?t=${Date.now()}`, { cache: "no-store" }); return r.json(); },
});
let dashKey = "";
function dashUpdate(force = true) {
  if (mode !== "dashboard") return;
  const key = `${index.length}:${index.length ? index[index.length - 1].i : -1}:${loadedI}:${evalD ? evalD.frames : 0}`;
  if (!force && key === dashKey) return;
  dashKey = key;
  dash.render({ index, snap: evalD, selectedI: loadedI });
}
const mon = createMonitor($("mon"));
let monData = null, monKey = "", pollN = 0, peers = [], monStab = null, stabKey = "";
async function loadPeers() {
  try {
    const r = await fetch(`peers.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) return;
    const list = (await r.json()).peers || [];
    const out = [];
    for (const p of list) {
      const get = async f => { try { const q = await fetch(`peer/${p.k}/${f}?t=${Date.now()}`, { cache: "no-store" }); return q.ok ? await q.json() : null; } catch (e) { return null; } };
      const [ix, mo] = await Promise.all([get("index.json"), get("monitor.json")]);
      out.push({ name: p.name, index: (ix && ix.snapshots) || [], rows: (mo && mo.rows) || [] });
    }
    peers = out;
  } catch (e) { /* peers are optional */ }
}
function monUpdate(force = true) {
  if (mode !== "monitor") return;
  const rows = (monData && monData.rows) || [];
  const key = `${rows.length}:${rows.length ? rows[rows.length - 1].seq : -1}:${index.length}:${monStab ? (monStab.evals || []).length : 0}:${peers.map(p => p.index.length + "/" + p.rows.length).join(",")}`;
  if (!force && key === monKey) return;
  monKey = key;
  mon.render({ rows, meta: monData || {}, index, peers, stability: monStab });
}
let dashResize = 0;
addEventListener("resize", () => { clearTimeout(dashResize); dashResize = setTimeout(() => { if (mode === "dashboard") dash.rerender(); if (mode === "monitor") mon.rerender(); }, 200); });
window.__viz = { seek: i => S && seek(i), get frame() { return fpos; }, get drawn() { return drawn; }, get loaded() { return loadedI; },
                 get ready() { return !!S; }, get idle() { return idle ? idleReason : ""; }, get mode() { return mode; },
                 get dbg() { return { idle, idleReason, hostMinimized, visibility: document.visibilityState, fpsCap, lastDraw: Math.round(lastDraw), playing, endAt: Math.round(endAt) }; },
                 get source() { return source; }, get shown() { return shown; }, get monitorRows() { return monData ? (monData.rows || []).length : 0; }, get inputMode() { return inputMode; }, get hasAttr() { return !!(S && S.ATTR); },
                 get roll() { return { haveRollout, rollSeq, rollPending, rollLoading, loaded: shown === "rollout" && S ? S.D.meta.rollout : -1 }; },
                 setHidden, setMode: applyMode, setSource: s => setSource(s, true), wake: () => wake("input") };

if (mode === "dashboard" || mode === "monitor") applyMode(mode);
if (window.SNAPSHOT) applySnapshot(window.SNAPSHOT);
else if (LIVE) { $("wait").style.display = "grid"; poll(); }
else fail("no snapshot data — run tools/viz/capture_snapshot.py or open through tools/viz/live_viewer.py");
requestAnimationFrame(frame);
</script>
