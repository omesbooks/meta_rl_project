<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neural Trader</title>
<style>
  :root {
    --bg: #02030a; --fg: #d9e7ff; --dim: #5d6b8a;
    --cyan: #19e6ff; --mag: #ff2e88; --green: #00ffa3; --gold: #ffc53d; --orange: #ff8a1f;
    --hud: "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font-family: var(--hud); }
  canvas { display: block; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 0 8px currentColor; }
  #title { top: 16px; left: 24px; }
  #title h1 { margin: 0; font: 700 22px/1 var(--hud); letter-spacing: .32em; color: var(--cyan); }
  #title div { margin-top: 6px; font-size: 12px; letter-spacing: .14em; color: var(--dim); text-shadow: none; }
  #stats { top: 14px; right: 24px; display: grid; grid-template-columns: repeat(3, auto); gap: 6px 22px; text-align: right; }
  .stat .k { font: 600 10px/1 var(--hud); letter-spacing: .22em; color: var(--dim); text-shadow: none; }
  .stat .v { font: 600 21px/1.2 var(--hud); font-variant-numeric: tabular-nums; }
  .lbl { position: fixed; pointer-events: none; font: 600 13px/1 var(--hud); letter-spacing: .12em;
         white-space: nowrap; transform: translate(-50%, -50%); text-shadow: 0 0 10px currentColor; }
  .lbl.tag { font: 600 10px/1 var(--hud); letter-spacing: .3em; color: var(--dim); text-shadow: none; }
  .lbl.out { transform: translate(14px, -50%); font-size: 14px; }
  .lbl.out .bar { display: inline-block; height: 4px; margin-left: 8px; vertical-align: middle;
                  background: currentColor; box-shadow: 0 0 8px currentColor; border-radius: 2px; }
  #chartLbl { left: 24px; font: 600 10px/1 var(--hud); letter-spacing: .3em; color: var(--dim); text-shadow: none; }
  #pxHi, #pxLo { right: 24px; font: 600 12px/1 var(--hud); color: var(--dim); text-shadow: none; }
  .panel { position: fixed; background: rgba(6, 10, 24, .72); border: 1px solid rgba(25, 230, 255, .18);
           border-radius: 12px; backdrop-filter: blur(6px); font-size: 13px; color: var(--dim); }
  #ctrl { right: 18px; bottom: 14px; display: flex; gap: 10px; align-items: center; padding: 7px 12px; }
  #timeline { left: 18px; bottom: 14px; padding: 8px 12px; display: none; gap: 12px; align-items: center; }
  #timeline .lab { font: 600 12px/1.25 var(--hud); color: var(--fg); min-width: 210px; }
  #timeline .lab small { display: block; color: var(--dim); font-size: 11px; letter-spacing: .08em; }
  .panel button { background: transparent; color: var(--cyan); border: 1px solid rgba(25, 230, 255, .35);
                  border-radius: 7px; padding: 3px 9px; font: 600 12px var(--hud); cursor: pointer; }
  .panel button.on { background: rgba(25, 230, 255, .14); }
  .panel button.rec { color: var(--mag); border-color: rgba(255, 46, 136, .5); }
  .panel input[type=range] { width: 80px; accent-color: var(--cyan); }
  #tSlider { width: 170px; }
  .panel select { background: #070b1a; color: var(--fg); border: 1px solid #1d2a4a; border-radius: 6px; }
  #spark { display: block; }
  #wait, #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; pointer-events: none; }
  #wait h2 { margin: 0; font: 700 20px var(--hud); letter-spacing: .4em; color: var(--cyan); text-shadow: 0 0 14px var(--cyan); }
  #wait p { color: var(--dim); letter-spacing: .14em; }
  #err { color: var(--mag); font: 600 16px var(--hud); }
  #idle { position: fixed; top: 104px; left: 50%; transform: translateX(-50%); pointer-events: none;
          font: 600 12px var(--hud); letter-spacing: .22em; color: var(--dim); white-space: nowrap;
          padding: 6px 14px; border: 1px solid rgba(93, 107, 138, .35); border-radius: 999px;
          background: rgba(6, 10, 24, .6); opacity: 0; transition: opacity .4s; }
  body.dash #gl, body.dash #labels, body.dash #stats, body.dash #chartLbl, body.dash #pxHi,
  body.dash #pxLo, body.dash #idle, body.dash .c3d { display: none !important; }
  #banner { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); pointer-events: none;
            font: 700 16px var(--hud); letter-spacing: .3em; color: var(--gold); text-shadow: 0 0 14px var(--gold);
            opacity: 0; transition: opacity .35s; white-space: nowrap; }
</style>
</head>
<body>
<div id="title" class="hud"><h1>NEURAL&nbsp;TRADER</h1><div id="sub"></div></div>
<div id="stats" class="hud">
  <div class="stat"><div class="k">BAR</div><div class="v" id="sBar" style="color:var(--fg)">–</div></div>
  <div class="stat"><div class="k">EQUITY</div><div class="v" id="sEq">–</div></div>
  <div class="stat"><div class="k">POSITION</div><div class="v" id="sPos">–</div></div>
  <div class="stat"><div class="k">TRADES</div><div class="v" id="sTr" style="color:var(--cyan)">–</div></div>
  <div class="stat"><div class="k">WIN RATE</div><div class="v" id="sWr" style="color:var(--gold)">–</div></div>
  <div class="stat"><div class="k">CRITIC V(s)</div><div class="v" id="sV">–</div></div>
</div>
<div id="labels"></div>
<div id="dash"></div>
<div id="chartLbl" class="hud"></div>
<div id="pxHi" class="hud"></div><div id="pxLo" class="hud"></div>
<div id="banner"></div>
<div id="idle"></div>
<div id="timeline" class="panel">
  <div class="lab" id="tLab">–<small>–</small></div>
  <input id="tSlider" type="range" min="0" max="0" value="0">
  <svg id="spark" width="170" height="40"></svg>
  <button id="bLive" class="on">● LIVE</button>
</div>
<div id="ctrl" class="panel">
  <label>mode <select id="iMode"><option value="lite">Lite</option><option value="cinematic">Cinematic</option><option value="dashboard">Dashboard</option></select></label>
  <button id="bPlay" class="c3d">❚❚</button>
  <label class="c3d">speed <input id="iSpeed" type="range" min="1" max="20" value="6"></label>
  <label class="c3d">synapses <select id="iK"><option value="4">4</option><option value="8" selected>8</option><option value="16">16</option></select></label>
  <label class="c3d">glow <input id="iGlow" type="range" min="0" max="30" value="9"></label>
  <label class="c3d">fps <select id="iFps"><option>15</option><option>20</option><option>30</option><option>60</option></select></label>
  <button id="bRot" class="on c3d">orbit</button>
  <button id="bRec" class="rec c3d">● rec</button>
  <button id="bFull">⛶</button>
</div>
<div id="wait"><div><h2>WAITING FOR THE FIRST EVALUATION</h2><p>a snapshot arrives after every 10,000 training steps</p></div></div>
<div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/",
  "viz-dashboard": "./dashboard.js"
} }
</script>
<script>window.SNAPSHOT = /*__SNAPSHOT__*/null;</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { createDashboard } from "viz-dashboard";

const params = new URLSearchParams(location.search);
const LIVE = params.has("live") && !window.SNAPSHOT;
// Display modes (measured in WebView2, docs/viz_display_modes_2026-10-11.md):
//   lite      ~20-25% of one core — no bloom, 4 synapses/neuron, no pulses, 1x pixels, 20 fps
//   cinematic ~60%                — bloom, 8 synapses, pulses, up to 2x pixels, 30 fps
//   dashboard ~0%                 — static panels redrawn only when a snapshot arrives (no loop)
// URL: mode=lite|cinematic (default: lite when live, cinematic for a static page);
// single knobs bloom=0|1 · k=4|8|16 · pulses=0|1 · dpr=1|2 · fps=N override the preset.
// Auto idle: live pages play each snapshot once, then stop rendering until the next
// evaluation arrives or the mouse moves (loop=1 to keep looping); every page stops
// while minimised/hidden and after 8 s paused without input.
const MODES = {
  lite:      { bloom: false, k: 4, pulses: false, dpr: 1, fps: 20 },
  cinematic: { bloom: true,  k: 8, pulses: true,  dpr: 2, fps: 30 },
  dashboard: { bloom: false, k: 4, pulses: false, dpr: 1, fps: 20, dashboard: true },
};
let mode = MODES[params.get("mode")] ? params.get("mode") : (LIVE ? "lite" : "cinematic");
const OPT = Object.assign({}, MODES[mode]);
if (params.has("bloom")) OPT.bloom = params.get("bloom") !== "0";
if (params.has("pulses")) OPT.pulses = params.get("pulses") !== "0";
if (params.has("dpr")) OPT.dpr = +params.get("dpr");
if (params.has("k")) OPT.k = +params.get("k");
if (params.has("fps")) OPT.fps = +params.get("fps");
OPT.play = params.get("play") !== "0";
const LOOP = params.has("loop") ? params.get("loop") === "1" : !LIVE;
let fpsCap = OPT.fps;
document.getElementById("iFps").value = String(fpsCap);
document.getElementById("iMode").value = mode;
const $ = id => document.getElementById(id);
const fail = msg => { const e = $("err"); e.style.display = "grid"; e.textContent = msg; };

// ================================================================== static scene
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(OPT.dpr, 2, devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
renderer.domElement.id = "gl";
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.FogExp2(0x02030a, 0.0085);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 600);
camera.position.set(-44, 13, 31);
if (LIVE) camera.position.multiplyScalar(1.1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-7, 0, 0); controls.enableDamping = true;
controls.minDistance = 20; controls.maxDistance = 140;
let sway = true, swayHold = 0;
controls.addEventListener("start", () => { swayHold = 1e9; });
controls.addEventListener("end", () => { swayHold = performance.now() + 6000; });
const sph = new THREE.Spherical(), off3 = new THREE.Vector3();

const chartScene = new THREE.Scene();
const chartCam = new THREE.OrthographicCamera(0, innerWidth, innerHeight, 0, -10, 10);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const chartPass = new RenderPass(chartScene, chartCam); chartPass.clear = false; chartPass.clearDepth = true;
composer.addPass(chartPass);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.45, 0.22);
composer.addPass(bloom);
bloom.enabled = OPT.bloom;
composer.addPass(new OutputPass());

const glowPoints = (n, pixelSpace = false) => {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute("aColor", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute("aSize", new THREE.BufferAttribute(new Float32Array(n), 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { uScale: { value: 1 } },
    vertexShader: `attribute vec3 aColor; attribute float aSize; uniform float uScale; varying vec3 vC;
      void main() { vC = aColor; vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = ${pixelSpace ? "aSize * uScale" : "aSize * uScale / -mv.z"}; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying vec3 vC;
      void main() { float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d); a = a * a;
        if (a < 0.003) discard; gl_FragColor = vec4(vC * (a + smoothstep(0.10, 0.0, d) * 0.6), a); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const p = new THREE.Points(g, m); p.frustumCulled = false; return p;
};
const C_POS = new THREE.Color(1.0, 0.42, 0.06), C_NEG = new THREE.Color(0.05, 0.72, 1.0);
const C_UP = new THREE.Color(0.0, 1.0, 0.55), C_DN = new THREE.Color(1.0, 0.1, 0.42), C_GOLD = new THREE.Color(1.0, 0.72, 0.12);
const ACTION_COLORS = { hold: "#9fb3d9", buy: "#00ffa3", sell: "#ff2e88", close: "#ffc53d", move_sl_breakeven: "#b48cff", trail_sl_atr: "#19e6ff" };
const FALLBACK_COLORS = ["#9fb3d9", "#00ffa3", "#ff2e88", "#ffc53d", "#b48cff", "#19e6ff", "#ff8a1f", "#7dff6b"];

{ // dust + synthwave floor
  const n = 2500, g = glowPoints(n), pa = g.geometry.attributes;
  for (let i = 0; i < n; i++) {
    const r = 70 + Math.random() * 160, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pa.position.array.set([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph) * 0.6, r * Math.sin(ph) * Math.sin(th)], i * 3);
    const c = Math.random() < 0.5 ? C_NEG : C_POS, b = 0.08 + Math.random() * 0.18;
    pa.aColor.array.set([c.r * b, c.g * b, c.b * b], i * 3); pa.aSize.array[i] = 20 + Math.random() * 60;
  }
  g.material.uniforms.uScale.value = 10; scene.add(g);
  const grid = new THREE.GridHelper(260, 52, 0x0b3a66, 0x071a33); grid.position.y = -19;
  grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);
}

// ================================================================== chart (pixel space, built once)
const CW_BARS = 110;
const bodies = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }), CW_BARS + 2);
bodies.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array((CW_BARS + 2) * 3), 3);
bodies.frustumCulled = false; bodies.count = 0; chartScene.add(bodies);
const wickGeo = new THREE.BufferGeometry();
wickGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array((CW_BARS + 2) * 6), 3));
wickGeo.setAttribute("color", new THREE.BufferAttribute(new Float32Array((CW_BARS + 2) * 6), 3));
const wicks = new THREE.LineSegments(wickGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
wicks.frustumCulled = false; wickGeo.setDrawRange(0, 0); chartScene.add(wicks);
const triShape = new THREE.Shape(); triShape.moveTo(0, 0.6); triShape.lineTo(-0.55, -0.4); triShape.lineTo(0.55, -0.4); triShape.lineTo(0, 0.6);
const markers = new THREE.InstancedMesh(new THREE.ShapeGeometry(triShape), new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }), (CW_BARS + 2) * 2);
markers.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array((CW_BARS + 2) * 6), 3);
markers.frustumCulled = false; markers.count = 0; chartScene.add(markers);
const eqGeo = new THREE.BufferGeometry();
eqGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array((CW_BARS + 2) * 3), 3));
const eqLine = new THREE.Line(eqGeo, new THREE.LineBasicMaterial({ color: C_GOLD, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending }));
eqLine.frustumCulled = false; eqGeo.setDrawRange(0, 0); chartScene.add(eqLine);
const gridGeo = new THREE.BufferGeometry();
gridGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(5 * 6 + 6), 3));
chartScene.add(new THREE.LineSegments(gridGeo, new THREE.LineBasicMaterial({ color: 0x0d2a4d, transparent: true, opacity: 0.8 })));
const head = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: C_GOLD, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending }));
head.visible = false; chartScene.add(head);
const NB = 900, bursts = glowPoints(NB, true);
const bVel = new Float32Array(NB * 2), bLife = new Float32Array(NB);
bursts.material.uniforms.uScale.value = renderer.getPixelRatio();
chartScene.add(bursts);
let burstNext = 0, CH = {};
function layoutChart() {
  const w = innerWidth, h = innerHeight;
  const lift = LIVE ? 44 : 0;   // room for the timeline panel
  CH = { x0: 70, x1: w - 90, y0: 34 + lift, y1: Math.max(150, h * 0.27) + lift };
  chartCam.right = w; chartCam.top = h; chartCam.updateProjectionMatrix();
  const g = gridGeo.attributes.position.array;
  for (let i = 0; i < 5; i++) { const y = CH.y0 + (CH.y1 - CH.y0) * i / 4; g.set([CH.x0, y, 0, CH.x1, y, 0], i * 6); }
  g.set([CH.x1, CH.y0, 0, CH.x1, CH.y1, 0], 30); gridGeo.attributes.position.needsUpdate = true;
  $("chartLbl").style.bottom = (CH.y1 + 10) + "px";
  $("pxHi").style.bottom = (CH.y1 - 12) + "px";
  $("pxLo").style.bottom = (CH.y0 - 4) + "px";
}
function burst(x, y, col, n = 70) {
  const bp = bursts.geometry.attributes.position.array, bc = bursts.geometry.attributes.aColor.array;
  for (let j = 0; j < n; j++) {
    const i = burstNext; burstNext = (burstNext + 1) % NB;
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 260;
    bp.set([x, y, 0], i * 3); bVel[i * 2] = Math.cos(a) * v; bVel[i * 2 + 1] = Math.sin(a) * v + 80;
    bLife[i] = 0.5 + Math.random() * 0.8; const b = 0.8 + Math.random() * 1.4;
    bc.set([col.r * b, col.g * b, col.b * b], i * 3);
  }
}

// ================================================================== snapshot state (rebuilt per snapshot)
let S = null;            // decoded snapshot + derived layout
let NET = null;          // scene objects of the current network
const labels = $("labels");
const mkLbl = (cls, html, color) => { const d = document.createElement("div"); d.className = "lbl " + cls; d.innerHTML = html; if (color) d.style.color = color; labels.appendChild(d); return d; };
const dec = (s, T) => { const b = Uint8Array.from(atob(s), c => c.charCodeAt(0)); return new T(b.buffer); };

function prepare(D) {
  const s = { D, Q: dec(D.q, Int8Array), W: D.width, NF: D.frames, NIN: D.n_in, WIN: D.window,
              NFEAT: D.n_features, AL: D.actor_layers, CL: D.critic_layers, names: D.actions,
              labels: D.action_labels || D.actions.map(a => a.toUpperCase()), NA: D.actions.length };
  s.layers = []; let o = s.NIN;
  s.AL.forEach((n, i) => { s.layers.push({ tower: 0, idx: i, size: n, off: o }); o += n; });
  s.CL.forEach((n, i) => { s.layers.push({ tower: 1, idx: i, size: n, off: o }); o += n; });
  s.OFF_PROB = o; s.OFF_VAL = o + s.NA; s.NODES = s.OFF_VAL + 1;
  if (s.NODES !== s.W) throw new Error(`snapshot width ${s.W} != layout ${s.NODES}`);
  s.towerLayers = [s.layers.filter(l => l.tower === 0), s.layers.filter(l => l.tower === 1)];
  s.mats = [D.edges.actor, D.edges.critic].map(ms => ms.map(m => ({ rows: m.rows, cols: m.cols, k: m.k, idx: dec(m.idx, Int16Array), w: dec(m.w, Float32Array) })));
  s.colors = s.names.map((n, i) => ACTION_COLORS[n] || FALLBACK_COLORS[i % FALLBACK_COLORS.length]);
  s.cur = new Float32Array(s.W);
  return s;
}

const X_IN = -30, X_OUT = 24, Y_TOWER = [7.0, -7.0];
function layout(s) {
  const p = new Float32Array(s.NODES * 3);
  for (let i = 0; i < s.NIN; i++) {
    let r, c; if (i < s.WIN * s.NFEAT) { r = Math.floor(i / s.NFEAT); c = i % s.NFEAT; } else { r = s.WIN; c = Math.floor(s.NFEAT / 2) + (i - s.WIN * s.NFEAT - 1) * 6; }
    p[i * 3] = X_IN; p[i * 3 + 1] = 9.5 - r * (19 / s.WIN); p[i * 3 + 2] = -17 + c * (34 / Math.max(1, s.NFEAT - 1));
  }
  for (const tl of s.towerLayers) {
    const n = tl.length;
    tl.forEach((L, i) => {
      L.x = n > 1 ? -12 + i * (27 / (n - 1)) : 2;
      L.r = Math.min(7.5, Math.max(1.6, 5.6 * Math.sqrt(L.size / 256)));
      L.dot = 3.0 * Math.pow(256 / L.size, 0.25);
      for (let j = 0; j < L.size; j++) {
        const rr = L.r * Math.sqrt((j + 0.5) / L.size), th = j * 2.399963, k = (L.off + j) * 3;
        p[k] = L.x + Math.sin(j * 7.13) * 0.35; p[k + 1] = Y_TOWER[L.tower] + rr * Math.cos(th); p[k + 2] = rr * Math.sin(th);
      }
    });
  }
  const span = Math.min(2.4, 9 / Math.max(1, s.NA));
  for (let a = 0; a < s.NA; a++) { const k = (s.OFF_PROB + a) * 3; p[k] = X_OUT; p[k + 1] = Y_TOWER[0] + ((s.NA - 1) / 2 - a) * span; p[k + 2] = 0; }
  p[s.OFF_VAL * 3] = X_OUT; p[s.OFF_VAL * 3 + 1] = Y_TOWER[1]; p[s.OFF_VAL * 3 + 2] = 0;
  s.posOf = p;
}

function disposeNet() {
  if (!NET) return;
  for (const o of [NET.nodes, NET.synapses, NET.pulses]) { scene.remove(o); o.geometry.dispose(); o.material.dispose(); }
  labels.innerHTML = "";
  NET = null;
}

function buildNet(s) {
  disposeNet();
  layout(s);
  const nodes = glowPoints(s.NODES);
  nodes.geometry.attributes.position.array.set(s.posOf);
  scene.add(nodes);
  // synapses ordered by rank, so a draw range keeps the K strongest per neuron
  const E = [];
  [0, 1].forEach(ti => {
    const tl = s.towerLayers[ti];
    s.mats[ti].forEach((M, mi) => {
      for (let r = 0; r < M.rows; r++) for (let q = 0; q < M.k; q++) {
        const sIdx = M.idx[r * M.k + q];
        const src = mi === 0 ? sIdx : tl[mi - 1].off + sIdx;
        const dst = mi < tl.length ? tl[mi].off + r : (ti === 0 ? s.OFF_PROB + r : s.OFF_VAL);
        E.push(src, dst, M.w[r * M.k + q] * (mi === 0 ? 5.0 : 2.6), q);
      }
    });
  });

    off3.copy(camera.position).sub(controls.target); sph.setFromVector3(off3);
    const az = -0.95 + 0.42 * Math.sin(now * 0.00011), pol = 1.25 + 0.12 * Math.sin(now * 0.00007);
    sph.theta += (az - sph.theta) * 0.02; sph.phi += (pol - sph.phi) * 0.02;
    off3.setFromSpherical(sph); camera.position.copy(controls.target).add(off3);

  composer.render();
  if (endAt && now - endAt > 1500) sleep("replay");          // let the last bursts fade first
  else if (!playing && now - lastInput > 8000) sleep("paused");
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h); bloom.setSize(w, h);
  camera.aspect = w / h; camera.setViewOffset(w, h, 0, h * 0.13, w, h); camera.updateProjectionMatrix();
  layoutChart();
}
addEventListener("resize", resize);
resize();

function applyMode(name) {
  if (!MODES[name]) return;
  const leavingDash = mode === "dashboard" && name !== "dashboard";
  mode = name; Object.assign(OPT, MODES[name]);
  $("iMode").value = name;
  document.body.classList.toggle("dash", name === "dashboard");
  if (name === "dashboard") { sleep("dashboard"); dashUpdate(); return; }
  if (leavingDash && idle) { idle = false; idleReason = ""; lastT = performance.now(); lastDraw = 0; requestAnimationFrame(frame); }
  bloom.enabled = OPT.bloom; K = OPT.k; fpsCap = OPT.fps;
  renderer.setPixelRatio(Math.min(OPT.dpr, 2, devicePixelRatio || 1));
  composer.setPixelRatio(renderer.getPixelRatio());
  bursts.material.uniforms.uScale.value = renderer.getPixelRatio();
  resize();
  $("iK").value = String(K); $("iFps").value = String(fpsCap); $("iMode").value = name;
  wake("input");
}
$("iMode").onchange = e => applyMode(e.target.value);
$("bPlay").onclick = e => { playing = !playing; e.target.textContent = playing ? "❚❚" : "▶"; if (playing && endAt) seek(START); wake("input"); };
$("iSpeed").oninput = e => speed = +e.target.value;
$("iK").onchange = e => K = +e.target.value;
$("iGlow").oninput = e => glow = +e.target.value / 10;
$("iFps").onchange = e => fpsCap = +e.target.value;
$("bRot").onclick = e => { sway = !sway; swayHold = 0; e.target.classList.toggle("on", sway); };
$("bFull").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
let rec = null, chunks = [];
$("bRec").onclick = () => {      // records the WebGL canvas (HUD text is HTML and is not captured)
  const b = $("bRec");
  if (rec) { rec.stop(); return; }
  const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  rec = new MediaRecorder(renderer.domElement.captureStream(60), { mimeType: mime, videoBitsPerSecond: 16e6 }); chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(chunks, { type: "video/webm" }));
    a.download = `${(S && S.D.meta && S.D.meta.model) || "neural"}_trader.webm`; a.click(); rec = null; b.textContent = "● rec"; };
  rec.start(); b.textContent = "■ stop";
};
const dash = createDashboard($("dash"), {
  colors: ACTION_COLORS,
  fetchSnapshot: async e => { const r = await fetch(`run/${e.file}?t=${Date.now()}`, { cache: "no-store" }); return r.json(); },
});
let dashKey = "";
function dashUpdate(force = true) {
  if (mode !== "dashboard") return;
  const key = `${index.length}:${index.length ? index[index.length - 1].i : -1}:${loadedI}:${S ? S.NF : 0}`;
  if (!force && key === dashKey) return;
  dashKey = key;
  dash.render({ index, snap: S ? S.D : null, selectedI: loadedI });
}
let dashResize = 0;
addEventListener("resize", () => { clearTimeout(dashResize); dashResize = setTimeout(() => mode === "dashboard" && dash.rerender(), 200); });
window.__viz = { seek: i => S && seek(i), get frame() { return fpos; }, get drawn() { return drawn; }, get loaded() { return loadedI; },
                 get ready() { return !!S; }, get idle() { return idle ? idleReason : ""; }, get mode() { return mode; },
                 get dbg() { return { idle, idleReason, hostMinimized, visibility: document.visibilityState, fpsCap, lastDraw: Math.round(lastDraw), playing, endAt: Math.round(endAt) }; },
                 setHidden, setMode: applyMode, wake: () => wake("input") };

if (mode === "dashboard") applyMode("dashboard");
if (window.SNAPSHOT) applySnapshot(window.SNAPSHOT);
else if (LIVE) { $("wait").style.display = "grid"; poll(); }
else fail("no snapshot data — run tools/viz/capture_snapshot.py or open through tools/viz/live_viewer.py");
requestAnimationFrame(frame);
</script>
